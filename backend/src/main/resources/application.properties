spring.application.name=flowops
spring.profiles.default=prod
server.address=0.0.0.0

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flowops}
spring.datasource.username=${DB_USERNAME:flowops_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.secret.encoding=${JWT_SECRET_ENCODING:raw}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
logging.file.name=${LOG_FILE:logs/flowops.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
app.base-url=${APP_BASE_URL:}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.secrets-file=${BOOTSTRAP_SECRETS_FILE:config/secrets.properties}
app.activation.expiration-hours=${ACTIVATION_EXPIRATION_HOURS:48}
app.backup.directory=${BACKUP_DIRECTORY:backups}
app.postgres.bin=${POSTGRES_BIN:}
app.restore.enabled=${RESTORE_ENABLED:false}
app.restore.helper-path=${RESTORE_HELPER_PATH:}
# DONE tasks remain on active Kanban through this many local calendar days.
# Central retention/display policy. These values do not delete business records.
flowops.retention.completed-task-visible-days=${DONE_VISIBLE_DAYS:7}
flowops.retention.notification-days=${NOTIFICATION_RETENTION_DAYS:90}
flowops.retention.agent-log-days=${AGENT_LOG_RETENTION_DAYS:90}
# Chat messages and their files are deleted after this many days (about 3 months).
flowops.retention.chat-days=${CHAT_RETENTION_DAYS:90}
# Chat files are limited to 10 MB each.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Snapshot detail retention is intentionally review-only until production growth and report dependencies are measured.
